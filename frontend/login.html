<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSphere | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="left-panel">

        <h1>🎓 CampusSphere</h1>

        <h2>Connect. Learn. Grow.</h2>

        <p>
            A social platform built for students,
            freshers and alumni to connect,
            collaborate and grow together.
        </p>

    </div>

    <!-- Right Side -->
    <div class="right-panel">

        <div class="login-box">

            <h2>Welcome Back 👋</h2>

            <p>Login to continue</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <div class="password-wrapper">

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        id="toggleLoginPassword"
        aria-label="Show password"
    >
        👁️
    </button>

</div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="bottom-text">
                Don't have an account?

                <a href="register.html">

                    Register

                </a>

            </p>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
