<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusSphere | Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <!-- Left Side -->
    <div class="left-panel">

        <h1>🎓 CampusSphere</h1>

        <h2>Join Your Campus Community.</h2>

        <p>
            Connect with students, freshers and alumni.
            Share ideas, discover opportunities and
            grow together.
        </p>

    </div>


    <!-- Right Side -->
    <div class="right-panel">

        <div class="login-box">

            <h2>Create Account ✨</h2>

            <p>Join CampusSphere today</p>

            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <div class="password-wrapper">

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button
        type="button"
        class="password-toggle"
        id="toggleRegisterPassword"
        aria-label="Show password"
    >
        👁️
    </button>

</div>
                <select id="role" required>

                    <option value="">Select your role</option>

                    <option value="Student">
                        Student
                    </option>

                    <option value="Fresher">
                        Fresher
                    </option>

                    <option value="Alumni">
                        Alumni
                    </option>

                </select>

                <input
                    type="text"
                    id="university"
                    placeholder="University"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
